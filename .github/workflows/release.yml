name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # コミットで固定すると版を名前から読めないので、toolchain を明示する
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      # タグと各ファイルのバージョンが食い違ったままリリースしない
      - name: Check version matches tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          npm_version="$(node -p "require('./package.json').version")"
          cargo_version="$(cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml | node -p "JSON.parse(require('fs').readFileSync(0)).packages[0].version")"
          echo "tag=$tag package.json=$npm_version Cargo.toml=$cargo_version"
          [ "$tag" = "$npm_version" ] && [ "$tag" = "$cargo_version" ]

      - run: npm ci

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Clipglass ${{ github.ref_name }}'
          releaseBody: ''
          releaseDraft: true
          generateReleaseNotes: true
          prerelease: false
