name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package.json と Cargo.toml のバージョンがずれたままリリースに進まない
      - name: Check versions match
        shell: bash
        run: |
          npm_version="$(node -p "require('./package.json').version")"
          cargo_version="$(cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml | node -p "JSON.parse(require('fs').readFileSync(0)).packages[0].version")"
          echo "package.json=$npm_version Cargo.toml=$cargo_version"
          [ "$npm_version" = "$cargo_version" ]

      - run: npm ci
      - run: npm test
      - run: npm run build

      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

      # リリースと同じ手順でインストーラーまで作り、ビルドの壊れを早く見つける
      - name: Build installer
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
